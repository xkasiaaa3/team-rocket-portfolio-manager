<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Manager - Stocks</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/owned-stocks-styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Header -->
<header class="app-header">
    <div class="icon hamburger"><i class="fas fa-bars"></i></div>

    <div class="dropdown" id="dropdownMenu">
        <ul>
            <li>Portfolio 1</li>
            <li class="new">+ Create New Portfolio</li>
        </ul>
    </div>

    <div class="app-title">Pocket Rocket</div>
    <div class="portfolio-name">My Portfolio</div>
    <div class="portfolio-date">2015-01-01</div>
    <div class="forward-button">
        <button id="forward-day-button">
            <i class="fas fa-forward"></i> Next Day
        </button>
    </div>
</header>

<!-- Main Body -->
<main class="app-body">
    <!-- Column 1: Navigation -->
    <nav class="sidebar">
        <a href="index.html" class="nav-button">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="balance.html" class="nav-button">
            <i class="fas fa-wallet"></i> Manage Balance
        </a>
        <a href="stocks.html" class="nav-button">
            <i class="fas fa-chart-line"></i> View Stocks
        </a>
        <a href="owned.html" class="nav-button">
            <i class="fas fa-chart-column"></i> Owned Stocks
        </a>
        <a href="history.html" class="nav-button">
            <i class="fas fa-receipt"></i> Transaction History
        </a>
    </nav>

    <!-- Column 2: Stock List -->
    <section class="portfolio stocks-section">
        <div class="stock-controls">
            <input type="text" id="searchBar" placeholder="Search stocks..." />
            <div class="filters">
                <select id="sortOrder">
                    <option value="default">Sort by Size</option>
                    <option value="name">Sort by Name</option>
                    <option value="amount">Sort by Amount</option>
                </select>
            </div>
        </div>

        <table id="stockList" class="stock-list">
            <colgroup>
                <col style="width: 60%;">
                <col style="width: 20%;">
                <col style="width: 20%;">
            </colgroup>
            <thead>
            <tr>
                <th>Name and Symbol</th>
                <th>Amount</th>
                <th>Current Price</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="page-options">
            <button id="prevBtn"><i class="fas fa-angle-left"></i> Previous</button>
            <strong><span id="pageInfo"></span></strong>
            <button id="nextBtn">Next <i class="fas fa-angle-right"></i></button>
        </div>


        <!-- Modal for stock details -->
        <div id="stockModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2 id="stockTitle">Apple (AAPL)</h2>
                <canvas id="stockChart"></canvas>
                <div class="trade-actions">
                    <input type="number" id="quantity" placeholder="Quantity" />
                    <button id="buyButton">Buy</button>
                    <button id="sellButton">Sell</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Column 3: Right Content -->
    <aside class="market">
        <h3>Portfolio networth</h3>
        <span id="right-networth"></span>
        <h3>Balance</h3>
        <span id="right-balance"></span>
        <h3>Amount invested</h3>
        <span id="right-investment"></span>
        <h3>Profit</h3>
        <span id="right-profit"></span>
        <h3>Recent transactions</h3>
        <ul id="transactions-list">
        </ul>
    </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="scripts/owned-stocks-script.js"></script>
</body>
</html>
