<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Manager - Home</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/history-styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Header -->
<header class="app-header">
    <div class="icon hamburger"><i class="fas fa-bars"></i></div>

    <div class="dropdown" id="dropdownMenu">
        <ul>
            <li>Portfolio 1</li>
            <li class="new">+ Create New Portfolio</li>
        </ul>
    </div>

    <div class="app-title">Pocket Rocket</div>
    <div class="portfolio-name">My Portfolio</div>
    <div class="portfolio-date">2015-01-01</div>
    <div class="forward-button">
        <button id="forward-day-button">
            <i class="fas fa-forward"></i> Next Day
        </button>
    </div>
</header>

<!-- Main Body -->
<main class="app-body">
    <!-- Column 1: Navigation -->
    <nav class="sidebar">
        <a href="index.html" class="nav-button">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="balance.html" class="nav-button">
            <i class="fas fa-wallet"></i> Manage Balance
        </a>
        <a href="stocks.html" class="nav-button">
            <i class="fas fa-chart-line"></i> View Stocks
        </a>
        <a href="history.html" class="nav-button">
            <i class="fas fa-receipt"></i> Transaction History
        </a>
    </nav>

    <!-- Column 2: Middle Content -->
    <section class="portfolio history-section">
        <div class="history-controls">
            <input type="text" id="searchBar" placeholder="Search transactions..." />
            <div class="filters">
                <select id="sortOrder">
                    <option value="default">Sort by most recent</option>
                    <option value="old">Sort by oldest</option>
                    <option value="symbol">Sort by Symbol</option>
                </select>
            </div>
        </div>

        <table id="history-list" class="history-list">
            <colgroup>
                <col style="width: 14%;">
                <col style="width: 14%;">
                <col style="width: 20%;">
                <col style="width: 20%;">
                <col style="width: 20%;">
                <col style="width: 16%;">
            </colgroup>
            <thead>
                <tr>
                    <th>Amount</th>
                    <th>Symbol</th>
                    <th>Date</th>
                    <th>Transaction Price</th>
                    <th>Current Price</th>
                    <th>Change</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="page-options">
            <button id="prevBtn"><i class="fas fa-angle-left"></i> Previous</button>
            <strong><span id="pageInfo"></span></strong>
            <button id="nextBtn">Next <i class="fas fa-angle-right"></i></button>
        </div>
    </section>

    <!-- Column 3: Right Content -->
    <aside class="market">
        <h3>Portfolio networth</h3>
        <span id="right-networth"></span>
        <h3>Balance</h3>
        <span id="right-balance"></span>
        <h3>Amount invested</h3>
        <span id="right-investment"></span>
        <h3>Profit</h3>
        <span id="right-profit"></span>
        <h3>Recent transactions</h3>
        <ul id="transactions-list">
        </ul>
    </aside>
</main>

<script src="scripts/history-script.js"></script>
</body>
</html>
