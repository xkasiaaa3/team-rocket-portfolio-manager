<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Manager - Balance</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/balance-styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Header -->
<header class="app-header">
    <div class="icon hamburger"><i class="fas fa-bars"></i></div>

    <div class="dropdown" id="dropdownMenu">
        <ul>
            <li>Portfolio 1</li>
            <li class="new">+ Create New Portfolio</li>
        </ul>
    </div>

    <div class="app-title">Pocket Rocket</div>
    <div class="portfolio-name">My Portfolio</div>
    <div class="portfolio-date">2015-01-01</div>
    <div class="forward-button">
        <button id="forward-day-button">
            <i class="fas fa-forward"></i> Next Day
        </button>
    </div>
</header>

<!-- Main Body -->
<main class="app-body">
    <!-- Column 1: Navigation -->
    <nav class="sidebar">
        <a href="index.html" class="nav-button">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="balance.html" class="nav-button">
            <i class="fas fa-wallet"></i> Manage Balance
        </a>
        <a href="stocks.html" class="nav-button">
            <i class="fas fa-chart-line"></i> View Stocks
        </a>
        <a href="owned.html" class="nav-button">
            <i class="fas fa-chart-column"></i> Owned Stocks
        </a>
        <a href="history.html" class="nav-button">
            <i class="fas fa-receipt"></i> Transaction History
        </a>
    </nav>

    <!-- Column 2: Balance Display -->
    <section class="portfolio balance-section">
        <div class="funds-display"></div>
        <div class="funds-actions">
            <button class="action-button plus">
                <i class="fas fa-plus"></i> Add Funds
            </button>
            <div id="addFundsModal" class="modal">
                <div class="modal-content">
                    <span class="close-plus">&times;</span>
                    <h2>Add Funds</h2>
                    <label for="addFundsInput">Amount:</label>
                    <input type="number" id="addFundsInput" step="0.01" min="0.01" placeholder="0.00" />
                    <button id="submitAddFunds">Submit</button>
                </div>
            </div>
            <button class="action-button minus">
                <i class="fas fa-minus"></i> Withdraw Funds
            </button>
            <div id="withdrawFundsModal" class="modal">
                <div class="modal-content">
                    <span class="close-minus">&times;</span>
                    <h2>Withdraw Funds</h2>
                    <label for="withdrawFundsInput">Amount:</label>
                    <input type="number" id="withdrawFundsInput" step="0.01" min="0.01" placeholder="0.00" />
                    <button id="submitWithdrawFunds">Submit</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Column 3: Right Content -->
    <aside class="market">
        <h3>Portfolio networth</h3>
        <span id="right-networth"></span>
        <h3>Balance</h3>
        <span id="right-balance"></span>
        <h3>Amount invested</h3>
        <span id="right-investment"></span>
        <h3>Profit</h3>
        <span id="right-profit"></span>
        <h3>Recent transactions</h3>
        <ul id="transactions-list">
        </ul>
    </aside>
</main>

<script src="scripts/balance-script.js"></script>
</body>
</html>
