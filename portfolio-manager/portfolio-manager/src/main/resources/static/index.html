<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Manager - Home</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/index-styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- Header -->
<header class="app-header">
    <div class="icon hamburger"><i class="fas fa-bars"></i></div>
    <div class="portfolio-name">My Portfolio</div>
    <div class="portfolio-date">2015-01-01</div>
    <div class="forward-button">
        <button id="forward-day-button">
            <i class="fas fa-forward"></i> Next Day
        </button>
    </div>
</header>

<!-- Main Body -->
<main class="app-body">
    <!-- Column 1: Navigation -->
    <nav class="sidebar">
        <a href="index.html" class="nav-button">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="balance.html" class="nav-button">
            <i class="fas fa-wallet"></i> Manage Balance
        </a>
        <a href="stocks.html" class="nav-button">
            <i class="fas fa-chart-line"></i> View Stocks
        </a>
        <a href="history.html" class="nav-button">
            <i class="fas fa-receipt"></i> Transaction History
        </a>
    </nav>


    <!-- Column 2: Middle Content -->
    <section class="portfolio">
        <div class="networth">
            <h1>Networth:</h1>
            <span id="networth-change">%CHANGE</span>
        </div>
        <canvas id="portfolio-chart"></canvas>
        <div class="insights">
            <p><strong>Amount invested: </strong><span id="span-investment"></span></p>
            <p><strong>Profit: </strong><span id="span-networth"></span></p>
        </div>
    </section>

    <!-- Column 3: Right Content -->
    <aside class="market">
        <h3>Portfolio networth</h3>
        <span id="right-networth"></span>
        <h3>Balance</h3>
        <span id="right-balance"></span>
        <h3>Amount invested</h3>
        <span id="right-investment"></span>
        <h3>Profit</h3>
        <span id="right-profit"></span>
        <h3>Recent transactions</h3>
        <ul id="transactions-list">
        </ul>
    </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
<script src="scripts/index-script.js"></script>
</body>
</html>
